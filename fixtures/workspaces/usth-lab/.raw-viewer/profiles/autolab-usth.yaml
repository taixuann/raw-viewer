schema_version: 4
id: usth/autolab-usth
revision: 1
instrument:
  id: autolab-usth
  name: Autolab USTH
variants:
  cv:
    when:
      content_contains_any:
        - Potential applied (V)
        - Potential_applied_(V)
        - Potential_applied(V)
      filename_contains_all:
        - autolab-usth
        - .cv_
    format:
      kind: first-row-header
      extensions: [".txt"]
      delimiter: ";"
      decimal: ","
      encoding: [utf-8, windows-1252, iso-8859-1]
    rows:
      header: 1
      data_start: 2
    metadata: []
    columns:
      electrode_potential:
        role: channel
        header: "WE(1).Potential (V)"
        aliases: ["WE(1).Potential_(V)"]
        quantity: voltage
        unit: V
        label: Voltage
      current:
        role: channel
        header: "WE(1).Current (A)"
        aliases: ["WE(1).Current_(A)"]
        quantity: current
        unit: A
        label: Current
      scan:
        role: progression
        type: custom
        behavior: discrete
        header: Scan
        quantity: index
        unit: "1"
        label: Scan
      applied_voltage:
        role: skip
        header: "Potential applied (V)"
        aliases: ["Potential_applied_(V)", "Potential_applied(V)"]
      time:
        role: skip
        header: "Time (s)"
        aliases: ["Time_(s)"]
      index:
        role: skip
        header: Index
      q_plus:
        role: skip
        header: Q+
      q_minus:
        role: skip
        header: Q-
      current_range:
        role: skip
        header: Current range
    plot:
      x: electrode_potential
      y: [current]
  ca:
    when:
      content_contains_any:
        - Time (s)
        - Time_(s)
      filename_contains_all:
        - autolab-usth
        - .ca_
    format:
      kind: first-row-header
      extensions: [".txt"]
      delimiter: ";"
      decimal: ","
      encoding: [utf-8, windows-1252, iso-8859-1]
    rows:
      header: 1
      data_start: 2
    metadata: []
    columns:
      time:
        role: channel
        header: "Time (s)"
        aliases: ["Time_(s)"]
        quantity: time
        unit: s
        label: Time
      current:
        role: channel
        header: "WE(1).Current (A)"
        aliases: ["WE(1).Current_(A)"]
        quantity: current
        unit: A
        label: Current
      electrode_potential:
        role: skip
        header: "WE(1).Potential (V)"
        aliases: ["WE(1).Potential_(V)"]
      corrected_time:
        role: skip
        header: "Corrected time (s)"
        aliases: ["Corrected_time_(s)"]
      index:
        role: skip
        header: Index
      current_range:
        role: skip
        header: Current range
      overload:
        role: skip
        header: Overload
    plot:
      x: time
      y: [current]
  eis:
    when:
      content_contains_any:
        - Frequency (Hz)
      filename_contains_all:
        - autolab-usth
        - .eis_
    format:
      kind: first-row-header
      extensions: [".txt"]
      delimiter: ";"
      decimal: ","
      encoding: [utf-8]
    rows:
      header: 1
      data_start: 2
    metadata: []
    columns:
      frequency:
        role: channel
        header: "Frequency (Hz)"
        quantity: frequency
        unit: Hz
        label: Frequency
      z_prime:
        role: channel
        header: "Z' (Ω)"
        quantity: impedance_real
        unit: ohm
        label: "Z′"
      z_double_prime:
        role: channel
        header: "-Z'' (Ω)"
        quantity: impedance
        unit: ohm
        label: "−Z″"
      z_magnitude:
        role: channel
        header: "Z (Ω)"
        quantity: impedance
        unit: ohm
        label: "|Z|"
      phase:
        role: channel
        header: "-Phase (°)"
        quantity: phase
        unit: deg
        label: "−Phase"
        required: false
      index:
        role: skip
        header: Index
      time:
        role: skip
        header: "Time (s)"
        aliases: ["Time_(s)"]
    plot:
      x: z_prime
      y: [z_double_prime]
  cv_2col:
    when:
      content_contains_any:
        - WE(1)_potential(V)
        - WE(1)_current(A)
      filename_contains_all:
        - autolab-usth
        - .cv_
    format:
      kind: first-row-header
      extensions: [".txt"]
      delimiter: ";"
      decimal: ","
      encoding: [utf-8, windows-1252, iso-8859-1]
    rows:
      header: 1
      data_start: 2
    metadata: []
    columns:
      potential:
        role: channel
        header: WE(1)_potential(V)
        quantity: voltage
        unit: V
        label: Voltage
      current:
        role: channel
        header: WE(1)_current(A)
        quantity: current
        unit: A
        label: Current
    plot:
      x: potential
      y: [current]
