[package]
name = "raw-viewer-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Shared RawView core. Resolves config paths and loads TOML settings."

[dependencies]
directories = "6.0.0"
encoding_rs = "0.8.35"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
toml = "1.1.8"
