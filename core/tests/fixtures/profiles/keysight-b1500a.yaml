      content_contains_any:
        - "time_s,current_a"
        - "time_s, current_a"
      filename_contains_all:
        - keysight-b1500a.wgfmu
    format:
      kind: first-row-header
      extensions:
        - .csv
      delimiter: ","
      encoding:
        - utf-8
        - windows-1252
        - iso-8859-1
    rows:
      header: 1
      data_start: 2
    metadata: []
    columns:
      time:
        role: channel
        header: time_s
        quantity: time
        unit: s
        label: Time
      current:
        role: channel
        header: current_a
        quantity: current
        unit: A
        label: Current
    plot:
      x: time
      y:
        - current
  wgfmu-ppf-index:
    when:
      content_contains_any:
