schema_version: 4
id: usth/keysight-b1500a
revision: 1
instrument:
  id: keysight-b1500a
  name: Keysight B1500A Semiconductor Device Parameter Analyzer
  vendor: Keysight Technologies
  model: B1500A
variants:
  dual-sweep:
    when:
      content_contains_any:
        - 2-terminal dual Vsweep
        - dual Vsweep
      filename_contains_all:
        - keysight-b1500a.dual-sweep
    format:
      kind: tabular
      extensions:
        - .csv
      delimiter: ","
      encoding:
        - utf-8
        - windows-1252
        - iso-8859-1
    rows:
      names_prefix: DataName
      data_prefix: DataValue
    metadata: []
    columns:
      voltage:
        role: channel
        header: V1
        quantity: voltage
        unit: V
        label: Voltage
      current:
        role: channel
        header: I2
        quantity: current
        unit: A
        label: Current
        aliases:
          - I1
    plot:
      x: voltage
      y:
        - current
  list-sweep:
    when:
      content_contains_any:
        - I/V List Sweep
      filename_contains_all:
        - keysight-b1500a
    format:
      kind: tabular
      extensions:
        - .csv
      delimiter: ","
      encoding:
        - utf-8
        - windows-1252
        - iso-8859-1
    rows:
      names_prefix: DataName
      data_prefix: DataValue
    metadata: []
    columns:
      voltage:
        role: channel
        header: V1
        quantity: voltage
        unit: V
        label: Voltage
      current:
        role: channel
        header: I2
        quantity: current
        unit: A
        label: Current
        aliases:
          - I1
    plot:
      x: voltage
      y:
        - current
  wgfmu:
    when:
      content_contains_any:
        - MeasResult
      filename_contains_all:
        - keysight-b1500a.wgfmu
    format:
      kind: tabular
      extensions:
        - .csv
      delimiter: ","
      encoding:
        - utf-8
        - windows-1252
        - iso-8859-1
    rows:
      names_prefix: DataName
      data_prefix: DataValue
    metadata: []
    columns:
      time:
        role: channel
        header: Time
        quantity: time
        unit: s
        label: Time
      signal_1:
        role: channel
        header: MeasResult1_value
        quantity: unknown
        unit: unspecified
        label: Channel 1
      signal_2:
        role: channel
        header: MeasResult2_value
        quantity: unknown
        unit: unspecified
        label: Channel 2
      meas_time1:
        role: channel
        header: MeasResult1_time
        quantity: time
        unit: s
        label: Meas time 1
        required: false
      meas_time2:
        role: channel
        header: MeasResult2_time
        quantity: time
        unit: s
        label: Meas time 2
        required: false
    plot:
      x: time
      y:
        - signal_1
  wgfmu-ppf-time:
