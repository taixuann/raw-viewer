    format:
      kind: first-row-header
      extensions:
        - .csv
      delimiter: ","
      encoding:
        - utf-8
        - windows-1252
        - iso-8859-1
    rows:
      header: 1
      data_start: 2
    metadata: []
    columns:
      pulse_index:
        role: channel
        header: index-pulse
        quantity: pulse
        unit: pulse
        label: Pulse index
      current:
        role: channel
        header: current_a
        quantity: current
        unit: A
        label: Current
    plot:
      x: pulse_index
      y:
        - current
  wgfmu-stp:
    when:
      content_contains_any:
        - "time_s,voltage_v,current_v"
