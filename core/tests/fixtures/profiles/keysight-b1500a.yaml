      filename_contains_all:
        - keysight-b1500a.wgfmu
    format:
      kind: first-row-header
      extensions:
        - .csv
      delimiter: ","
      encoding:
        - utf-8
        - windows-1252
        - iso-8859-1
    rows:
      header: 1
      data_start: 2
    metadata: []
    columns:
      time:
        role: channel
        header: time_s
        quantity: time
        unit: s
        label: Time
      voltage:
        role: channel
        header: voltage_v
        quantity: voltage
        unit: V
        label: Voltage
      current:
        role: channel
        header: current_v
        quantity: unknown
        unit: unspecified
        label: current_v
      fit:
        role: channel
        header: fit
        quantity: unknown
        unit: unspecified
        label: Fit
        required: false
      fit_current:
        role: channel
        header: fit_current
        quantity: unknown
        unit: unspecified
        label: Fit current
        required: false
    plot:
      x: time
      y:
        - voltage
  wgfmu-endurance:
