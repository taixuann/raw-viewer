      extensions:
        - .csv
      delimiter: ","
      encoding:
        - utf-8
        - windows-1252
        - iso-8859-1
    rows:
      names_prefix: DataName
      data_prefix: DataValue
    metadata: []
    columns:
      cycles:
        role: channel
        header: raw_cycles
        quantity: cycles
        unit: cycles
        label: Cycles
      channel_2:
        role: channel
        header: raw_ch2
        quantity: unknown
        unit: unspecified
        label: Channel 2
      channel_1:
        role: channel
        header: raw_ch1
        quantity: unknown
        unit: unspecified
        label: Channel 1
        required: false
    plot:
      x: cycles
      y:
        - channel_2
