schema_version: 1
instrument:
  id: keysight-b1500a
  name: Keysight B1500A Semiconductor Device Parameter Analyzer
  vendor: Keysight Technologies
  model: B1500A
formats:
  - id: csv
    kind: tabular
    extensions: [".csv"]
    delimiter: ","
    encoding: [utf-8, windows-1252, iso-8859-1]
    rows:
      names_prefix: "DataName"
      data_prefix: "DataValue"
    columns:
      voltage:
        header: "V1"
        quantity: voltage
        unit: "V"
        label: "Voltage"
      current:
        header: "I2"
        aliases: ["I1"]
        quantity: current
        unit: "A"
        label: "Current"
modes:
  - id: dual-sweep
    format: csv
    detect: ["2-terminal dual Vsweep", "dual Vsweep"]
    extract:
      x: voltage
      y: [current]
