[package]
name = "raw-viewer-cli"
version = "0.3.2"
edition = "2021"
license = "MIT"
publish = false
description = "CLI for raw-viewer over the Rust core"

[[bin]]
name = "raw-viewer"
path = "src/main.rs"

[dependencies]
raw-viewer-core = { path = "../../core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
