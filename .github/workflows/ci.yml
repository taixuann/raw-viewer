name: ci

on:
  pull_request:
  push:
    branches: [master, "codex/**"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      swift: ${{ steps.filter.outputs.swift }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: "blob:none"
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'core/**'
              - 'bindings/**'
              - 'apps/cli/**'
              - 'apps/tauri/**'
              - 'Cargo.*'
              - 'Scripts/**'
              - '.github/workflows/ci.yml'
            swift:
              - 'apps/macos/**'
              - 'core/**'
              - 'Cargo.*'
              - 'Scripts/**'
              - '.github/workflows/ci.yml'
            contracts:
              - 'core/**'
              - 'apps/macos/**'
              - 'Scripts/**'
              - '.github/workflows/ci.yml'

  pr-acceptance-mapping:
    name: pr acceptance mapping
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Checkout required: scripts and self-test fixtures live in the repo (PR_BODY alone is not enough).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: "blob:none"
      - name: Acceptance mapping check self-test
        run: ./Scripts/check_pr_acceptance_mapping_self_test.sh
      - name: PR body includes acceptance-case mapping
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./Scripts/check_pr_acceptance_mapping.sh

  pr-owned-files:
    name: pr owned files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: "blob:none"
      - name: Owned files check self-test
        run: ./Scripts/check_pr_owned_files_self_test.sh
      - name: PR changed files stay within owned list
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" > /tmp/changed.txt
          ./Scripts/check_pr_owned_files.sh /dev/null /tmp/changed.txt

  cross-language-test-contract:
    name: cross-language test contract
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Path filter check
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ needs.changes.outputs.contracts }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping contract check: no contract-related files were changed."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.should_run == 'true'
        with:
          filter: "blob:none"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: steps.check.outputs.should_run == 'true'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        if: steps.check.outputs.should_run == 'true'
      - name: Cross-language contract check self-test
        if: steps.check.outputs.should_run == 'true'
        run: ./Scripts/check_cross_language_test_contract_self_test.sh
      - name: Cross-language grammar contract check
        if: steps.check.outputs.should_run == 'true'
        run: ./Scripts/check_cross_language_test_contract.sh
      - name: Rust grammar vector tests
        if: steps.check.outputs.should_run == 'true'
        run: cargo test -p raw-viewer-core --test grammar_vectors

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - name: Path filter check
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ needs.changes.outputs.rust }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping rust matrix: no rust-related files were changed."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.should_run == 'true'
        with:
          filter: "blob:none"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: steps.check.outputs.should_run == 'true'
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.check.outputs.should_run == 'true'
      - name: Cache Linux system dependencies
        if: runner.os == 'Linux' && steps.check.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/apt-archives
          key: apt-tauri-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            apt-tauri-${{ runner.os }}-
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux' && steps.check.outputs.should_run == 'true'
        run: |
          mkdir -p /home/runner/.cache/apt-archives/partial
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives=/home/runner/.cache/apt-archives \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
          sudo chown -R runner:runner /home/runner/.cache/apt-archives || true
          sudo rm -f /home/runner/.cache/apt-archives/lock* || true
      - name: cargo fmt
        if: steps.check.outputs.should_run == 'true'
        run: cargo fmt --check
      - name: cargo clippy
        if: steps.check.outputs.should_run == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        if: steps.check.outputs.should_run == 'true'
        run: cargo test --workspace

  swift:
    name: swift (macos)
    needs: changes
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Path filter check
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ needs.changes.outputs.swift }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping swift check: no swift-related files were changed."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.should_run == 'true'
        with:
          filter: "blob:none"
      - name: Swift toolchain
        if: steps.check.outputs.should_run == 'true'
        run: swift --version
      - name: Cache Swift PM
        if: steps.check.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: apps/macos/.build
          key: swift-spm-${{ runner.os }}-${{ hashFiles('apps/macos/Package.swift') }}
          restore-keys: |
            swift-spm-${{ runner.os }}-
      - name: swift build
        if: steps.check.outputs.should_run == 'true'
        working-directory: apps/macos
        run: swift build
      - name: swift test
        if: steps.check.outputs.should_run == 'true'
        working-directory: apps/macos
        run: swift test
      - name: Golden JSON lock (Swift reader)
        if: steps.check.outputs.should_run == 'true'
        working-directory: apps/macos
        run: |
          ./Scripts/write_golden_measurements.sh
          cd ../..
          git diff --exit-code core/tests/golden
      - name: Core self-check
        if: steps.check.outputs.should_run == 'true'
        working-directory: apps/macos
        run: ./Scripts/check_core.sh
      - name: Index CLI check
        if: steps.check.outputs.should_run == 'true'
        working-directory: apps/macos
        run: ./Scripts/check_index_cli.sh
