name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          swift --version
          xcodebuild -version
      - run: Scripts/check_core.sh
      - run: swift test
